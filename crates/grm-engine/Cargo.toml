[package]
name = "grm-engine"
description = "The heart of the GRM machine: a network of nodes and relations that settles by Gaussian belief propagation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bincode = "1.3.3"
indexmap = { version = "2", features = ["serde"] }
rayon = "1"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.16.5"
